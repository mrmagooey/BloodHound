name: Standalone Mode (kglite)

on:
  push:
    branches:
      - main
      - standalone
  pull_request:
    branches:
      - main
      - standalone

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.0"
  RUST_TOOLCHAIN: stable

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: kglite-ffi/target
          key: rust-target-${{ runner.os }}-${{ hashFiles('kglite-ffi/Cargo.lock', 'kglite-ffi/src/**', 'kglite-ffi/kglite/**') }}
          restore-keys: |
            rust-target-${{ runner.os }}-

      - name: Build kglite static library
        run: cd kglite-ffi && cargo build --release --no-default-features --features ffi

      - name: Run kglite Rust tests
        run: cd kglite-ffi && cargo test --no-default-features --features ffi

      - name: Run Go e2e tests (kglite)
        run: go test -v -tags e2e -timeout 30m ./cmd/api/src/test/e2e/

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: kglite-ffi/target
          key: rust-target-${{ runner.os }}-${{ hashFiles('kglite-ffi/Cargo.lock', 'kglite-ffi/src/**', 'kglite-ffi/kglite/**') }}
          restore-keys: |
            rust-target-${{ runner.os }}-

      - name: Build kglite static library
        run: cd kglite-ffi && cargo build --release --no-default-features --features ffi

      - name: Build standalone binary
        env:
          CGO_ENABLED: "1"
        run: go build -tags standalone -o bloodhound-standalone ./cmd/api/src/cmd/bhapi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodhound-standalone-linux-amd64
          path: bloodhound-standalone
          retention-days: 14

  build-container:
    name: Build Container
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=standalone-latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'standalone') }}
            type=sha,prefix=standalone-

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/standalone.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
